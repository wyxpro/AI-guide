<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线模式 - 翠玉AI导览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Noto Sans SC", -apple-system, sans-serif;
      background: linear-gradient(135deg, #FAF8F5 0%, #F0EDE5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1E2522;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #1E2522;
    }
    p {
      font-size: 0.875rem;
      color: #8F9F8F;
      line-height: 1.6;
    }
    .btn {
      margin-top: 2rem;
      padding: 0.875rem 2rem;
      background: linear-gradient(135deg, #4F6F52, #3A5240);
      color: white;
      border: none;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🌿</div>
    <h1>当前处于离线模式</h1>
    <p>您现在无法连接到网络，但可以继续浏览已缓存的景点内容。恢复联网后，所有功能将自动恢复。</p>
    <a href="/" class="btn">返回首页</a>
  </div>
</body>
</html>
